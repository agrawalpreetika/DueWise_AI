name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  uuid: ^4.4.0
  font_awesome_flutter: ^10.7.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Assets path properly defined here:
  assets:
    - assets/icons/logo.png

# Flutter Launcher Icons configuration (Root level par, flutter: ke bahar)
flutter_launcher_icons:
  image_path: "assets/icons/logo.png"
  android: true
  ios: true
  web:
    generate: true